name: Formula
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          stable: true
      - run: brew style mccodeman/tap/nysos
      - run: brew install --build-from-source mccodeman/tap/nysos
      - run: brew test mccodeman/tap/nysos
      - run: brew audit --strict mccodeman/tap/nysos
